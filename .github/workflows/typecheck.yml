name: Typecheck

# `next build` artık tip hatalarında duruyor (typescript.ignoreBuildErrors kaldırıldı,
# bkz apps/web/next.config.mjs). Bu CI hâlâ gerekli: `next build` yalnız apps/web
# tsconfig'ini denetler; buradaki `tsc --noEmit` mobil ve packages/* workspace'lerini
# de kapsar ve hatayı build'den önce yakalar.

on:
  push:
    branches: [master]
  pull_request:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck (web + mobile)
        run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # node --test .ts dosyalarını native tip-strip ile koşar (Node 23.6+ varsayılan).
          # Yerel geliştirme Node 24; CI de 24 kullansın ki testler flag'siz çalışsın.
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      # data/app.db 227MB ve gitignore'lı olduğu için CI checkout'unda yoktur;
      # DB'ye bağlı testler kendi kapılarıyla atlanır (apps/web/src/lib/testDbGuard.ts),
      # DB'den bağımsız olanlar koşar. test:core buraya eklendi çünkü analiz
      # kalite seti daha önce hiçbir otomasyona bağlı değildi.
      - name: Unit tests (web + mobile + core)
        run: |
          npm run test
          npm run test:mobile
          npm run test:core
